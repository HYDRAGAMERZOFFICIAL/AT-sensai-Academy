# ===================================================================
# AT SENSEI ACADEMY — PRODUCTION CONFIGURATION
# PostgreSQL + Render
# ===================================================================

spring.application.name=AT Sensei Academy Backend

server.port=${PORT:8081}
server.address=0.0.0.0
server.servlet.context-path=/

# -------------------------------------------------------------------
# PostgreSQL
# -------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# H2 console must never be enabled in production
spring.h2.console.enabled=false

# -------------------------------------------------------------------
# Admin configuration
# -------------------------------------------------------------------

admin.access.password=${ADMIN_ACCESS_PASSWORD}

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.atsensei.academy=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
