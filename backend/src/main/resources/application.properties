# ===================================================================
# AT SENSEI ACADEMY — SPRING BOOT BACKEND CONFIGURATION
# ===================================================================

server.port=8081
server.servlet.context-path=/

# SQL Relational Database (H2 In-Memory with full SQL syntax, schema & data initialization)
spring.datasource.url=jdbc:h2:mem:atsenseidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at /h2-console for DB inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate SQL Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.com.atsensei.academy=INFO
logging.level.org.springframework.web=INFO
