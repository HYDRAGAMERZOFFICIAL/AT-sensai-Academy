# ===================================================================
# AT SENSEI ACADEMY — SPRING BOOT BACKEND CONFIGURATION
# Dynamically reads from Environment Variables with Safe Defaults
# ===================================================================

# Application Info
spring.application.name=${APP_NAME:AT Sensei Academy Backend}
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/

# SQL Relational Database Settings
spring.datasource.url=${DB_URL:jdbc:h2:mem:atsenseidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 In-Memory Web Console (enabled for local development)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate SQL Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.defer-datasource-initialization=true

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.atsensei.academy=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
