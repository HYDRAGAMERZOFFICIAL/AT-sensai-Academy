# ===================================================================
# AT SENSEI ACADEMY — SPRING BOOT BACKEND CONFIGURATION
# Local Development Configuration — H2 Database
# ===================================================================

# -------------------------------------------------------------------
# Application Info & Server Binding
# -------------------------------------------------------------------

spring.application.name=AT Sensei Academy Backend

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/

# -------------------------------------------------------------------
# H2 DATABASE CONFIGURATION
# -------------------------------------------------------------------

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:atsenseidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# H2 WEB CONSOLE
# -------------------------------------------------------------------

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allows access to H2 Console from other hosts during development
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# -------------------------------------------------------------------

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create/update tables from entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=false

# Format generated SQL
spring.jpa.properties.hibernate.format_sql=true

# Allow data.sql to run after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# SQL file encoding
spring.sql.init.encoding=UTF-8

# -------------------------------------------------------------------
# LOGGING CONFIGURATION
# -------------------------------------------------------------------

logging.level.root=INFO

logging.level.com.atsensei.academy=INFO

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=WARN

# -------------------------------------------------------------------
# DEVELOPMENT NOTES
# -------------------------------------------------------------------
#
# H2 Console:
# http://localhost:8081/h2-console
#
# JDBC URL:
# jdbc:h2:mem:atsenseidb
#
# Username:
# sa
#
# Password:
# [leave empty]
#
# IMPORTANT:
# Do NOT use:
# jdbc:h2:C:/Users/Sujith/test
#
# This configuration uses an IN-MEMORY database.
# The database exists only while the Spring Boot application is running.
# -------------------------------------------------------------------